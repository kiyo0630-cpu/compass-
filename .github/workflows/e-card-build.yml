name: e-card build

# e-card-src/ のソースが main で変わったら Vite でビルドし、GitHub Pages の配信元である
# e-card/ に出力してコミットする。公開 URL: https://<user>.github.io/<repo>/e-card/
on:
  push:
    branches: [main]
    paths:
      - 'e-card-src/**'
      - '.github/workflows/e-card-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e-card-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e-card-src/package-lock.json
      - name: Install
        working-directory: e-card-src
        run: npm ci
      - name: Build into e-card/
        working-directory: e-card-src
        run: npm run build
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e-card
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "e-card: rebuild $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin main
            git push
          fi
