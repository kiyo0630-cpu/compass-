name: attack-map feed

# Cloudflare Radar から「日本を標的とする攻撃の送信元国シェア」を毎時取得し、
# attack-map/data/latest.json としてコミットする。GitHub Pages 上のページがこのファイルを読む。
# あわせて attack-map/data/history/ に 1 回分を 1 行として追記し、統計ページ（attack-map/stats/）が過去データを読む。
# 取得後に直近 7 日のベースライン（git 履歴）と比較し、異常を attack-map/data/alerts.json に記録する。
# 有効化: リポジトリの Settings → Secrets and variables → Actions に CLOUDFLARE_API_TOKEN を登録する。
on:
  schedule:
    - cron: '17 * * * *'   # 毎時 17 分（UTC）
  workflow_dispatch:
    inputs:
      range:
        description: '集計期間 (1h / 6h / 1d / 7d)'
        default: '1d'
        required: false

permissions:
  contents: write

concurrency:
  group: attack-map-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 異常検知のベースライン（latest.json の過去コミット）を読むため全履歴を取得
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch snapshot from Cloudflare Radar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ATTACK_MAP_RANGE: ${{ github.event.inputs.range || '1d' }}
        run: node attack-map/scripts/fetch-radar.mjs --out attack-map/data/latest.json
      - name: Append snapshot to history (data/history/YYYY-MM.jsonl)
        run: node attack-map/scripts/history.mjs append --in attack-map/data/latest.json --dir attack-map/data/history
      - name: Detect anomalies against the 7-day baseline
        id: anomalies
        run: node attack-map/scripts/detect-anomalies.mjs --latest attack-map/data/latest.json --out attack-map/data/alerts.json --days 7
      - name: Aggregate attacks on your own Cloudflare zones (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_IDS: ${{ secrets.CLOUDFLARE_ZONE_IDS }}
        run: node attack-map/scripts/targets-from-cloudflare-zone.mjs --out attack-map/data/targets.json
      - name: Vendor world map outline (once)
        run: |
          if [ ! -s attack-map/data/countries-110m.json ]; then
            curl -fsSL https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json -o attack-map/data/countries-110m.json
          fi
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attack-map/data/latest.json attack-map/data/alerts.json attack-map/data/countries-110m.json attack-map/data/history
          [ -f attack-map/data/targets.json ] && git add attack-map/data/targets.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "attack-map: update feed $(date -u +%Y-%m-%dT%H:%MZ) (anomalies: ${{ steps.anomalies.outputs.status || 'n/a' }}) [skip ci]"
            git push
          fi
