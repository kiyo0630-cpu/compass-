<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4436">
<title>席割り表</title>
<meta name="description" content="固定ルールと出社率から、祝日・休暇を加味して5席の席割りを月ごとに自動作成するページ。">
<style>
:root{
  --leather:#1d4436; --leather-dk:#142f26;
  --gilt:#b98a2f; --gilt-lt:#d8bc78;
  --paper:#f8f5ec; --paper-dk:#efe9da;
  --ink:#26241f; --ink-soft:#6d6656; --rule:#d9d2bf;
  --red:#a63a2e; --blue:#2f5a86; --green-ok:#2e6b4f;
  --auto:#fff3cf; --leave:#f1e1dd; --hol:#ece7db;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.6;padding:0 16px 48px}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--leather);color:var(--paper);margin:0 -16px 20px;padding:18px 16px;border-bottom:3px solid var(--gilt)}
header h1{font-size:20px;font-weight:600;letter-spacing:.06em}
header p{font-size:12px;opacity:.85;margin-top:4px}
.wrap{max-width:1100px;margin:0 auto}
.card{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.card h2{font-size:15px;color:var(--leather);border-left:4px solid var(--gilt);padding-left:8px;margin-bottom:10px}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.nav h2{border:0;padding:0;font-size:18px;min-width:9em}
.btn{background:var(--paper-dk);border:1px solid var(--rule);border-radius:8px;padding:5px 12px}
.btn:hover{background:var(--gilt-lt)}
.btn.primary{background:var(--leather);color:#fff;border-color:var(--leather-dk)}
.btn.danger{color:var(--red)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--rule);padding:6px 8px;text-align:center;white-space:nowrap}
th{background:var(--paper-dk);font-weight:600}
td.date{text-align:left}
tr.sat td.date{color:var(--blue)}
tr.sun td.date,tr.hol td.date{color:var(--red)}
tr.off td{background:var(--hol);color:var(--ink-soft)}
tr.off td.note{text-align:left}
td.auto{background:var(--auto)}
td.auto select,td.empty select{border:0;background:transparent;width:100%;text-align:center}
td.empty{background:var(--leave)}
td.fixed{font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid var(--rule);vertical-align:-2px;margin-right:4px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.member{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--paper)}
.member .name{font-weight:600;display:flex;justify-content:space-between;align-items:center}
.member .rule{font-size:12px;color:var(--ink-soft)}
.member .rate{display:flex;align-items:center;gap:6px;margin:6px 0}
.member input[type=number]{width:5em;padding:3px 6px;border:1px solid var(--rule);border-radius:6px;text-align:right}
.member input[type=date]{padding:3px 6px;border:1px solid var(--rule);border-radius:6px}
.leaves{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.leaves span{background:var(--leave);border-radius:6px;padding:1px 6px;font-size:12px}
.leaves span b{cursor:pointer;margin-left:4px;color:var(--red)}
.small{font-size:12px;color:var(--ink-soft)}
.help{font-size:12px;color:var(--ink-soft);margin-top:6px}
@media (max-width:600px){body{font-size:13px}th,td{padding:5px 4px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>席割り表</h1>
  <p>固定ルール + 出社率 + 祝日・休暇 から、5席の割り当てを月ごとに自動作成します。入力はこの端末のブラウザに保存されます。</p>
</div></header>
<div class="wrap">

<div class="card">
  <div class="nav">
    <button class="btn" id="prev">◀ 前月</button>
    <h2 id="title"></h2>
    <button class="btn" id="next">翌月 ▶</button>
    <button class="btn" id="today">今月</button>
    <span class="small" id="summary"></span>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>日付</th><th>曜</th><th>1番目</th><th>2番目</th><th>3番目</th><th>4番目</th><th>5番目</th></tr></thead>
    <tbody id="body"></tbody>
  </table></div>
  <div class="legend">
    <span><i style="background:#fff"></i>固定</span>
    <span><i style="background:var(--auto)"></i>自動(出社率の低い順)</span>
    <span><i style="background:var(--leave)"></i>空席(候補なし)</span>
    <span><i style="background:var(--hol)"></i>土日祝</span>
    <span>自動席はプルダウンで手動変更できます(日付ごとに保存)</span>
  </div>
</div>

<div class="card">
  <h2>メンバーと出社率</h2>
  <div class="members" id="members"></div>
  <p class="help">出社率(%)は手入力です。空席は、その日に席がなく休暇でもない人のうち出社率が最も低い人から埋めます。同率の場合は上の並び順が優先です。</p>
  <p style="margin-top:8px"><button class="btn danger" id="reset">保存データをすべて消す</button></p>
</div>

</div>
<script>
// ---------- 固定ルール ----------
// weekday: 1=月 2=火 3=水 4=木 5=金
const MEMBERS = [
  {id:'nishikawa', name:'西川', days:[1,2,3,4,5], label:'毎日(1番目)'},
  {id:'shimao',    name:'島尾', days:[1,2,3,4,5], label:'毎日(2番目)'},
  {id:'onoe',      name:'尾上', days:[3,5], label:'水・金(片山とセット)'},
  {id:'katayama',  name:'片山', days:[3,5], label:'水・金(尾上とセット)'},
  {id:'sekiguchi', name:'関口', days:[3,5], label:'水・金'},
  {id:'baba',      name:'馬場', days:[1,2], label:'月・火'},
  {id:'suda',      name:'須田', days:[1,2], label:'月・火'},
  {id:'kadono',    name:'門野', days:[1,4], label:'月・木'},
  {id:'hirota',    name:'廣田', days:[2,4], label:'火・木'},
];
// 曜日ごとの席順(1〜5番目)。null は自動割り当て席
const SEATS = {
  1:['nishikawa','shimao','baba','suda','kadono'],
  2:['nishikawa','shimao','baba','suda','hirota'],
  3:['nishikawa','shimao','onoe','katayama','sekiguchi'],
  4:['nishikawa','shimao','kadono','hirota',null],
  5:['nishikawa','shimao','onoe','katayama','sekiguchi'],
};
const SEAT_FOR = m => { // 補助: その人の既定席番号
  const d = m.days[0]; return SEATS[d].indexOf(m.id)+1;
};

// ---------- 保存 ----------
const KEY='seats-v1';
let state = {rates:{}, leaves:{}, overrides:{}};
try{ const s=localStorage.getItem(KEY); if(s) state=Object.assign(state, JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
MEMBERS.forEach(m=>{ if(state.rates[m.id]==null) state.rates[m.id]=100; if(!state.leaves[m.id]) state.leaves[m.id]=[]; });

// ---------- 日本の祝日 ----------
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nthMon(y,m,n){ const d=new Date(y,m-1,1); const off=(8-d.getDay())%7; return 1+off+7*(n-1); }
function holidaysOf(y){
  const h={};
  const add=(m,d,name)=>{ h[y+'-'+pad(m)+'-'+pad(d)]=name; };
  add(1,1,'元日');
  add(1,nthMon(y,1,2),'成人の日');
  add(2,11,'建国記念の日');
  if(y>=2020) add(2,23,'天皇誕生日');
  add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)),'春分の日');
  add(4,29,'昭和の日');
  add(5,3,'憲法記念日'); add(5,4,'みどりの日'); add(5,5,'こどもの日');
  if(y===2020){add(7,23,'海の日');add(7,24,'スポーツの日');add(8,10,'山の日');}
  else if(y===2021){add(7,22,'海の日');add(7,23,'スポーツの日');add(8,8,'山の日');}
  else {add(7,nthMon(y,7,3),'海の日');add(8,11,'山の日');add(10,nthMon(y,10,2),'スポーツの日');}
  add(9,nthMon(y,9,3),'敬老の日');
  add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)),'秋分の日');
  add(11,3,'文化の日'); add(11,23,'勤労感謝の日');
  // 振替休日
  Object.keys(h).slice().forEach(k=>{
    const d=new Date(k+'T00:00:00'); if(d.getDay()!==0) return;
    do{ d.setDate(d.getDate()+1); }while(h[ymd(d)]);
    h[ymd(d)]='振替休日';
  });
  // 国民の休日(祝日に挟まれた平日)
  for(let m=1;m<=12;m++){ for(let d=1;d<=31;d++){
    const t=new Date(y,m-1,d); if(t.getMonth()!==m-1) continue;
    const k=ymd(t); if(h[k]||t.getDay()===0) continue;
    const p=new Date(t); p.setDate(d-1); const n=new Date(t); n.setDate(d+1);
    if(h[ymd(p)]&&h[ymd(n)]) h[k]='国民の休日';
  }}
  return h;
}
const holCache={};
function holiday(d){ const y=d.getFullYear(); if(!holCache[y]) holCache[y]=holidaysOf(y); return holCache[y][ymd(d)]||null; }

// ---------- 割り当て ----------
function assign(d){
  const wd=d.getDay(), key=ymd(d);
  const onLeave=id=>state.leaves[id].includes(key);
  const seats=SEATS[wd].map(id=>({id, fixed:true}));
  const used=new Set();
  seats.forEach(s=>{ if(s.id&&onLeave(s.id)){ s.id=null; s.fixed=false; } else if(!s.id){ s.fixed=false; } if(s.id) used.add(s.id); });
  const ov=state.overrides[key]||{};
  // 手動指定
  seats.forEach((s,i)=>{ if(s.fixed) return; const o=ov[i]; if(o&&!used.has(o)&&!onLeave(o)){ s.id=o; s.manual=true; used.add(o);} });
  // 自動: 出社率の低い順
  const pool=MEMBERS.filter(m=>!used.has(m.id)&&!onLeave(m.id))
    .sort((a,b)=>(state.rates[a.id]-state.rates[b.id])||(MEMBERS.indexOf(a)-MEMBERS.indexOf(b)));
  seats.forEach(s=>{ if(s.id) return; const m=pool.shift(); if(m){ s.id=m.id; used.add(m.id);} });
  return seats;
}

// ---------- 描画 ----------
let cur=new Date(); cur=new Date(cur.getFullYear(),cur.getMonth(),1);
const WD='日月火水木金土';
const nameOf=id=>MEMBERS.find(m=>m.id===id)?.name||'';
function render(){
  const y=cur.getFullYear(), m=cur.getMonth();
  document.getElementById('title').textContent=`${y}年${m+1}月`;
  const tb=document.getElementById('body'); tb.innerHTML='';
  let autoCount=0, emptyCount=0;
  for(let d=new Date(y,m,1); d.getMonth()===m; d.setDate(d.getDate()+1)){
    const tr=document.createElement('tr'); const wd=d.getDay(); const hol=holiday(d); const key=ymd(d);
    tr.className=wd===0?'sun':wd===6?'sat':''; if(hol) tr.classList.add('hol');
    let html=`<td class="date">${m+1}/${d.getDate()}</td><td>${WD[wd]}</td>`;
    if(wd===0||wd===6||hol){ tr.classList.add('off'); html+=`<td class="note" colspan="5">${hol||'休み'}</td>`; }
    else{
      assign(d).forEach((s,i)=>{
        if(s.fixed){ html+=`<td class="fixed">${nameOf(s.id)}</td>`; return; }
        const onLeave=id=>state.leaves[id].includes(key);
        const autoLabel=s.manual?'(自動に戻す)':(s.id?nameOf(s.id)+' (自動)':'(空席)');
        const opts=[`<option value="" ${s.manual?'':'selected'}>${autoLabel}</option>`].concat(MEMBERS.filter(x=>!onLeave(x.id)).map(x=>`<option value="${x.id}" ${s.manual&&s.id===x.id?'selected':''}>${x.name}</option>`)).join('');
        if(s.id) autoCount++; else emptyCount++;
        html+=`<td class="${s.id?'auto':'empty'}"><select data-date="${key}" data-seat="${i}">${opts}</select></td>`;
      });
    }
    tr.innerHTML=html; tb.appendChild(tr);
  }
  document.getElementById('summary').textContent=`自動席 ${autoCount} / 空席 ${emptyCount}`;
  tb.querySelectorAll('select').forEach(sel=>sel.addEventListener('change',e=>{
    const {date,seat}=e.target.dataset; state.overrides[date]=state.overrides[date]||{};
    if(e.target.value) state.overrides[date][seat]=e.target.value; else delete state.overrides[date][seat];
    if(!Object.keys(state.overrides[date]).length) delete state.overrides[date];
    save(); render();
  }));
}
function renderMembers(){
  const box=document.getElementById('members'); box.innerHTML='';
  MEMBERS.forEach(m=>{
    const div=document.createElement('div'); div.className='member';
    const leaves=state.leaves[m.id].slice().sort();
    div.innerHTML=`<div class="name"><span>${m.name}</span><span class="rule">${m.label}</span></div>
      <div class="rate">出社率 <input type="number" min="0" max="100" step="1" value="${state.rates[m.id]}" data-id="${m.id}"> %</div>
      <div>休暇 <input type="date" data-leave="${m.id}"></div>
      <div class="leaves">${leaves.map(l=>`<span>${l.slice(5).replace('-','/')}<b data-rm="${m.id}" data-date="${l}">×</b></span>`).join('')}</div>`;
    box.appendChild(div);
  });
  box.querySelectorAll('input[type=number]').forEach(i=>i.addEventListener('change',e=>{
    let v=Number(e.target.value); if(isNaN(v)) v=100; v=Math.max(0,Math.min(100,v)); e.target.value=v;
    state.rates[e.target.dataset.id]=v; save(); render();
  }));
  box.querySelectorAll('input[type=date]').forEach(i=>i.addEventListener('change',e=>{
    const id=e.target.dataset.leave, v=e.target.value; if(!v) return;
    if(!state.leaves[id].includes(v)) state.leaves[id].push(v);
    save(); renderMembers(); render();
  }));
  box.querySelectorAll('b[data-rm]').forEach(b=>b.addEventListener('click',e=>{
    const {rm,date}=e.target.dataset; state.leaves[rm]=state.leaves[rm].filter(x=>x!==date);
    save(); renderMembers(); render();
  }));
}
document.getElementById('prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render();};
document.getElementById('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render();};
document.getElementById('today').onclick=()=>{const t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);render();};
document.getElementById('reset').onclick=()=>{ if(!confirm('出社率・休暇・手動指定をすべて消します。よろしいですか?')) return; state={rates:{},leaves:{},overrides:{}}; MEMBERS.forEach(m=>{state.rates[m.id]=100;state.leaves[m.id]=[];}); save(); renderMembers(); render(); };
renderMembers(); render();
</script>
</body>
</html>
